# ChattyBones - the line pack
#
# Everything your skeletons can say. Edit and save while the game is running and
# the change takes effect immediately. If you break something they keep using the
# last version that worked, and the reason, with a line number, goes to
# BepInEx/LogOutput.log.
#
# ChattyBones.lines.default.yaml next door is rewritten every launch with what the
# mod shipped with. Read that one, edit this one.
#
#
# WRITING LINES
#
#   lines:
#     cowardly:
#       Summoned:
#         - "Do I have to?"
#
# A skeleton is given a personality when you summon it and keeps it. Where its
# personality has nothing for an event it falls back to "common", per event - its
# own idle lines with the shared death lines is normal.
#
# Write more lines per group than feels necessary. Nobody repeats the line they
# just said, but that memory is one line deep, so a group of three audibly cycles.
#
# Personalities are whatever you name here. Two traps:
#
#   - a skeleton stores its personality as a position in the list SORTED
#     ALPHABETICALLY, so adding, removing or renaming one reshuffles which
#     personality your existing skeletons have. Nothing breaks - they change
#     character.
#   - "common" must be lower case. "Common" is read as an ordinary personality of
#     that name, and everything relying on the fallback goes quiet without a word.
#
#
# EVENTS
#
# Thirty-two things a skeleton reacts to, and which tokens each one can fill in.
# {name} and {player} are left out - every event has them.
#
#     T {target}       C {companion}     A {ally}
#     W {weapon}       K {weaponskill}    D {damage}
#     S {status}       B {biome}         I {item}
#     L {skill}
#
#                                                      T  C  A  W  K  D  S  B  I  L
#   Summoned             you raised it                 .  .  .  .  .  .  .  .  .  .
#   TargetAcquired       it picked something           T  .  .  .  .  .  .  .  .  .
#   Hurt                 something hit it              .  .  .  W  K  D  .  .  .  .
#   Buffed               it gained a helpful effect    .  .  .  .  .  .  S  .  .  .
#   Afflicted            it caught fire or poison      .  .  .  .  .  .  S  .  .  .
#   Weather              rain, water, or the swamp     .  .  .  .  .  .  S  .  .  .
#   Killed               it killed something           T  .  .  W  K  .  .  .  .  .
#   Died                 it died                       .  .  .  W  K  .  .  .  .  .
#   Unsummoned           it timed out or strayed       .  .  .  .  .  .  .  .  .  .
#   Idle                 nothing is happening          .  .  .  .  .  .  .  .  .  .
#   PlayerHurt           you took a hit                .  .  .  W  K  D  .  .  .  .
#   PlayerLandedABigHit  you hit something hard        T  .  .  W  K  D  .  .  .  .
#   PlayerGotAKill       you killed something          T  .  .  W  K  .  .  .  .  .
#   CompanionHurt        another skeleton was hit      .  C  .  W  K  D  .  .  .  .
#   CompanionKilled      another skeleton got a kill   T  C  .  W  K  .  .  .  .  .
#   CompanionDied        another skeleton died         .  C  .  .  .  .  .  .  .  .
#   CompanionSummoned    another was just raised       .  C  .  .  .  .  .  .  .  .
#   PlayerParried        you turned a blow in time     T  .  .  .  .  .  .  .  .  .
#   PlayerStaggered      something knocked you about   T  .  .  .  .  .  .  .  .  .
#   StaggeredIt          you knocked something about   T  .  .  .  .  .  .  .  .  .
#   PlayerDodged         you rolled clear of a blow    .  .  .  .  .  .  .  .  .  .
#   Dawn                 the sun came up               .  .  .  .  .  .  .  B  .  .
#   Nightfall            the light went                .  .  .  .  .  .  .  B  .  .
#   BiomeChanged         you crossed a biome border    .  .  .  .  .  .  .  B  .  .
#   Raid                 something is coming           .  .  .  .  .  .  .  .  .  .
#   RaidEnded            you saw it off                .  .  .  .  .  .  .  .  .  .
#   AtHome               you settled in safely         .  .  .  .  .  .  .  .  .  .
#   Looted               you picked something up       .  .  .  .  .  .  .  .  I  .
#   PlayerAte            you ate something             .  .  .  .  .  .  .  .  I  .
#   PlayerCooked         you made food or mead         .  .  .  .  .  .  .  .  I  .
#   PlayerSkilledUp      you got better at something   .  .  .  .  .  .  .  .  .  L
#   AllyArrived          another player came near      .  .  A  .  .  .  .  .  .  .
#
# A mark means the token CAN be filled, not that it always is. Keep a plain line
# in every group.
#
# D only reaches events that catch a blow as it lands: by the time a body is
# examined, the game has taken the fire and poison off its last hit.
#
# C and A mean something stronger than the rest. Both tokens work in ANY line - a
# skeleton will name a squadmate or a nearby player wherever you ask. A mark means
# the event names a PARTICULAR person, so "Oh no, {companion}!" under CompanionDied
# mourns the one that fell, while the same words under Killed name whoever is
# standing about.
#
# Spelling counts, capitals included. An event name that is not one of these is
# logged and skipped, and an event you leave out entirely is simply never commented
# on - a fine way to switch off a kind of chatter.
#
# Weather is mostly rain, but wading, swimming and the Swamp all raise it, so
# "My bones are wet" travels better than "it is raining".
#
#
# LINES THAT ONLY SUIT ONE MOMENT
#
# Tag an event and those lines are used only then:
#
#   cowardly:
#     Idle:
#       - "It's very open out here."
#     Idle[biome=Swamp]:
#       - "I do not like it here."
#
# Three tags. The values are exact, capitals and all:
#
#   biome=    Meadows   BlackForest   Swamp   Mountain   Plains
#             Mistlands   AshLands   DeepNorth   Ocean
#   time=     morning   afternoon   evening   night
#   home=     yes   no
#
# time is cut where the game cuts it: morning is dawn to noon, afternoon noon to
# sunset, evening sunset to midnight, night midnight to dawn.
#
# home is the game's own idea of being settled - resting, roofed, near a fire, in
# your base, nothing hunting you. It asks about YOU rather than the skeleton, so
# one left out in the woods still says home lines while you sit by the fire.
#
# "None" and "All" are real biome spellings the game keeps for its own bookkeeping.
# No skeleton is ever standing in one, so a group tagged with either is silent; for
# "anywhere", write a plain group. A bad biome is reported at load, a bad time or
# home value when the file is read, with its line number.
#
# Which group wins:
#
#   1. your personality's lines for this exact moment
#   2. your personality's plain lines
#   3. the shared lines for this exact moment
#   4. the shared plain lines
#
# Personality first, moment second. Where the plain group sits in the file makes no
# difference - a tagged group is tried before it either way.
#
# One tag per group: "Idle[biome=Swamp,time=night]" is refused and logged.
#
# WHEN TWO TAGS BOTH MATCH, THE ONE HIGHER UP THE FILE WINS, and nothing warns you
# about the loser. So put your rarest groups first. This file goes
#
#   home=yes, then biome, then time, and home=no last of all
#
# The value matters and not just the tag: every skeleton is either home or not, so
# [home=no] is true nearly always and will drown anything below it. That is why
# home appears twice, at opposite ends. A tagged group with one line in it repeats
# that line every time the moment comes round.
#
#
# TOKENS
#
# Five are people:
#
#   {name}        the skeleton speaking
#   {player}      you
#   {target}      the creature it is reacting to
#   {companion}   another of your skeletons
#   {ally}        another player standing near you
#
# Seven describe what happened and where:
#
#   {weapon}      the weapon by name, e.g. "Mistwalker"
#   {weaponskill}  the skill it is used with, e.g. "Swords", "Unarmed"
#   {damage}      the damage type, e.g. "Blunt", "Fire"
#   {status}      a status effect by name, e.g. "Burning"
#   {biome}       where it is standing, e.g. "Black Forest"
#   {item}        something you ate or picked up, e.g. "Carrot Soup"
#   {skill}       the skill that just went up, e.g. "Blocking"
#
# Only {name} and {player} are always there. A line asking for something we do not
# know is passed over and another chosen, so write a plain version beside any line
# that uses a token, or it will never be said:
#
#   - "Get lost, {target}!"
#   - "Get lost!"
#
# A typo like {targat} is left alone rather than guessed at, so you will see it
# floating over a skeleton's head. Tokens are lower case and case sensitive.
#
# Four things about wording:
#
#   - the weapon tokens belong only where the wielder is you or one of ours: a
#     kill, a companion's kill, a blow you landed. On an incoming blow they name
#     the attacker's hands, and a creature with no real weapon reports "sword", so
#     a skeleton mauled by a greydwarf announces it was done in by a sword. The
#     grid still marks those events - it says what CAN be filled, this says what
#     reads well, and it is the one place the two deliberately differ.
#   - {weapon} is a plain name, and "Bronze sword" turns up far more often than
#     "Mistwalker", so give it "my" or "the" rather than opening a line with it.
#   - {damage} is not a noun you can put "the" in front of. Write it attributively
#     - "{damage} damage" or "a {damage} hit" - or the other way round gets you
#     "Mind the Pierce". "the {damage} damage" is fine.
#   - {weaponskill} is the SKILL, plural, so it is "a fine use of Swords" and not
#     "handy with the Swords". "Unarmed" and "Blood Magic" are in that list too.
#   - {status}, {biome}, {item}, {damage} and {weaponskill} all arrive capitalized,
#     the way the game names them. That suits most of them mid-sentence; "My bones
#     are Wet." reads oddly, so put {status} where a capital is welcome.
#
# {ally} is empty when you play alone, which is what makes it safe to scatter
# about: the line is simply passed over until somebody is there to hear it.
#
# WRITING IN ANOTHER LANGUAGE. Write the lines in yours and every token follows -
# creatures, items, biomes, skills, status effects and damage types are all named
# by the game, in whatever language the person reading is playing in. In a shared
# world each player reads their own pack, so yours does not have to match anyone
# else's.
#
#
# OTHER PLAYERS
#
# Everybody running ChattyBones sees everybody's skeletons talk. There is nothing
# to install on a server, and players without the mod see nothing at all.
#
# You do not need the same file as your friends. What travels is WHICH LINE rather
# than the line itself, so each of you reads your own pack. When the line their
# game chose asks for something yours cannot work out, yours moves on to the next
# in the group - one more reason not to leave a group with a single line in it.
#
# HearOthers switches it off for your screen, and AllyGreetingForgetSeconds decides
# how often the same person is hailed again.
#
#
# YAML, BRIEFLY
#
# Indentation is meaningful. Spaces, never tabs, the same amounts you see here.
#
# Two things break the whole file, and quoting does not help with either:
#
#   - --- starts a second document and everything after it is ignored. Use a
#     comment line to separate sections.
#   - the same name twice in the same place: two "cowardly" blocks, or two "Idle"
#     under one personality.
#
# Keep the "double quotes" around every line below. Without them YAML reads several
# ordinary ways of opening a line as syntax - three of these fail loudly, two
# quietly change what your skeleton says:
#
#   - "{player}! Watch it!"        unquoted, { starts an object
#   - "'Tis but a scratch!"        unquoted, ' starts a quoted string
#   - "*rattles bones*"            unquoted, * starts a reference
#   - "Listen up: here's the plan" unquoted, a colon makes it a setting
#   - "You're # 1!"                unquoted, everything from # is dropped
#
# One exception, and it is the only one: inside double quotes a backslash starts an
# escape, so write two.
#
#   - "\\o/"                       one backslash refuses the file
#   - "shrug: ¯\\_(o_o)_/¯"        one backslash silently eats a character

# Color is by event rather than by personality: who is speaking is already clear
# from the name plate and the words, while whether something has gone wrong is
# worth knowing at a glance. Keep to a few pale shades - they are the ones that
# stay readable over grass, snow and lava alike.
colors:

  # Name as many or as few as you like. "normal" is the one every event uses
  # unless it is listed under events: below. Leave it out for Valheim's white.
  palette:
    normal: "#E8E4DC"
    alarm: "#F0A9A0"
    triumph: "#EFD79A"

  # Which events depart from normal.
  events:
    Died: alarm
    Hurt: alarm
    PlayerHurt: alarm
    CompanionHurt: alarm
    CompanionDied: alarm
    Afflicted: alarm
    Killed: triumph
    PlayerGotAKill: triumph
    CompanionKilled: triumph
    PlayerStaggered: alarm
    PlayerParried: triumph
    StaggeredIt: triumph
    PlayerDodged: triumph
    Raid: alarm
    RaidEnded: triumph

lines:

  # Lines anybody falls back on. Every event has something here, so a skeleton
  # is never stuck for words no matter which personality it drew.
  common:
    Summoned:
      - "Up we get."
      - "Who disturbs me? Oh. You."
      - "Right then, {player}."
    TargetAcquired:
      - "That {target} is mine."
      - "Oi! {target}!"
      - "Here we go."
    Hurt:
      - "Ow."
      - "That was a rib!"
      - "Still standing."
      - "Took some {damage} damage there."
    Buffed:
      - "Ooh, that's the stuff."
      - "Much obliged."
      - "{status}? Don't mind if I do."
    Afflicted:
      - "{status}. Right through to the bones."
      - "Ah. {status}. Wonderful."
      - "I do not care for this."
      - "{status}! Somebody do something!"
    Weather:
      - "{status}. Right through to the bones."
      - "{status}. Marvellous."
      - "This is why I stayed buried."
      - "Does anyone else feel that?"
    Killed:
      - "Down it goes."
      - "That {target} won't get up."
      - "Next."
      - "That is what we have the {weaponskill} for."
      - "My {weapon} does not miss."
    Died:
      - "Bugger."
      - "Tell my mum."
      - "Back to the dirt."
    Unsummoned:
      - "Off I go, then."
      - "See you, {player}."
    Idle:
      - "Nice weather for it."
      - "Anyone else cold?"
      - "I miss having skin."
      - "Hmm."
      - "{companion}, your insides are showing."
      - "Do you ever think about it, {companion}? Being alive?"
    PlayerHurt:
      - "{player}! Watch it!"
      - "They got you!"
      - "Careful, {player}."
      - "{player}! That was a {damage} hit!"
      - "Mind the {damage} damage, {player}."
    PlayerLandedABigHit:
      - "Ooooh."
      - "Did you see that?"
      - "Lovely swing, {player}."
      - "Nice {damage} hit with that {weapon}!"
      - "The {weaponskill} did its work."
    PlayerGotAKill:
      - "Got him!"
      - "Nice one, {player}."
      - "Nice {weaponskill} work, {player}."
    CompanionHurt:
      - "{companion}!"
      - "They're on {companion}!"
      - "Hang on, {companion}!"
      - "{companion} is taking {damage} damage!"
      - "It's {damage} damage on {companion}, {player}!"
    CompanionKilled:
      - "Leave some for me, {companion}."
      - "Handy with the {weaponskill}, {companion}."
      - "{companion} got the {target}."
      - "Show-off."
    CompanionDied:
      - "Oh no, {companion}!"
      - "{companion}! Get up!"
      - "They got {companion}."
    CompanionSummoned:
      - "Welcome to the party, {companion}."
      - "Look who's up."
      - "Budge up, {companion}."
    PlayerParried:
      - "Oh, that was clean."
      - "Turned it! Straight back at it."
      - "That {target} did not expect that."
      - "Beautiful, {player}."
    PlayerStaggered:
      - "{player}! Stay on your feet!"
      - "Steady, {player}!"
      - "That {target} is winning."
      - "Up, up, up!"
    StaggeredIt:
      - "The {target} is reeling!"
      - "Now! While it is down!"
      - "It did not care for that."
      - "Its guard is all over the place."
    PlayerDodged:
      - "Nimble!"
      - "Nothing touched you."
      - "How did you even do that?"
      - "I could never do that. No knees, see."
    Dawn:
      - "Ugh. Daylight."
      - "Morning over the {biome}. Joy."
      - "Is it always this bright?"
      - "Another day of this, then."
    Nightfall:
      - "Ah. Better."
      - "Night over the {biome}. That is more like it."
      - "Now we are in our element."
      - "Dark again. Good."
    BiomeChanged:
      - "The {biome}. Right."
      - "Back in the {biome}, then."
      - "I have a bad feeling about the {biome}."
      - "This place again."
    Raid:
      - "Something is coming."
      - "Something is out there."
      - "That does not sound good."
      - "Stand ready."
    RaidEnded:
      - "Still standing."
      - "Well. That happened."
      - "Is that all of them?"
      - "We saw it off."
    AtHome:
      - "Right. Feet up."
      - "Walls, a roof, a fire. Luxury."
      - "Nothing is trying to eat us. Novel."
      - "Safe as anything."
    Looted:
      - "More {item}, then."
      - "That {item} looks useful. Probably."
      - "Pocketing the {item}, are we?"
      - "Finders keepers, I suppose."
    PlayerAte:
      - "Eating some {item}? I used to eat."
      - "It goes straight through me these days."
      - "Enjoy the {item}. Truly."
      - "I remember tasting things."
    PlayerCooked:
      - "{item}. That takes me back."
      - "Making {item}, are we."
      - "The smell does nothing for me. It used to."
      - "All that work, and you will have it swallowed in a moment."
    PlayerSkilledUp:
      - "Better at {skill} now, are you."
      - "Your {skill} improves, {player}."
      - "Practice does it."
      - "You will be dangerous eventually."
    AllyArrived:
      - "Hail, {ally}."
      - "Company, {player}."
      - "Somebody's coming."
      - "Well met, {ally}."
      - "{ally}. You are a long way out."
      - "Another warm one. Hello."

  # Would rather be somewhere else.
  cowardly:
    PlayerCooked:
      - "Is that {item} for me, {player}? ...No. Of course not."
      - "Must you do that s-so near the fire?"
      - "{item} must s-smell nice, if I had a nose."
    Looted:
      - "Is that safe to carry?"
      - "That looks heavy."
    Raid:
      - "I want to go inside!"
      - "Can we not be here?"
      - "WHY DOES THIS ALWAYS HAPPEN TO ME!?"
    AtHome:
      - "Oh thank goodness, we're home."
      - "We are staying, yes? We are staying."
    PlayerStaggered:
      - "We are losing! We are losing!"
      - "Get up! Please get up!"
      - "This was a terrible idea!"
    PlayerDodged:
      - "Do that again, {player}! Do that every time!"
      - "Teach me that. Teach me that now."
      - "I would have just been hit. Every time."
    Summoned:
      - "Do I have to?"
      - "Oh no, not again."
    TargetAcquired:
      - "Is that a {target}? I'd rather not."
      - "Uh, I'm r-right behind you, {player}."
    Hurt:
      - "Aaargh!"
      - "I'm hit! I'm hit!"
      - "This is exactly what I meant."
      - "Ow! The {damage} damage! Not the {damage} damage!"
      - "I do not like {damage} damage. I do not like it one bit."
      - "Why is it always {damage} damage?"
    Killed:
      - "Did I do that?"
      - "It was mostly {player}, honestly."
      - "Now I never want to fight another {target} again!"
      - "The {weaponskill} did it! Not me! The {weaponskill}!"
      - "Is it over? Can I open my eyes?"
      - "My {weapon} did the work. I just held on."
    Idle:
      - "Can we go home?"
      - "It's very open out here."
      - "You'll look after us too, won't you {ally}?"
      - "Are you s-staying, {ally}? Only, it's safer in numbers."
      - "{ally} looks like they know what they're doing. Follow them."
    Idle[home=yes]:
      - "H-hey, it's nice and cozy here! Can we stay?"
      - "Nothing out there can get in, right?"
      - "Let's never leave. I mean it."
      - "I mean, why would we wanna go back out there anyway?"
    Idle[biome=Swamp]:
      - "I do not like it here."
      - "Can we go back to the open bit?"
      - "Every one of these trees is looking at me."
      - "Why is the water making that sound?"
    Idle[biome=Mistlands]:
      - "I would like to state that I am against this."
      - "{player}? Are you still there?"
      - "I can't see anything in this mist!"
      - "I keep hearing things and none of this is pleasant."
    Idle[biome=Plains]:
      - "I keep hearing this buzzing sound!"
      - "W-why does this feel like the meadows, but wrong?"
      - "You haven't seen any of those Tar Growths, have you?"
      - "Can't s-stand that laughter from the little guys..."
    Idle[time=night]:
      - "It's dark. It's dark and we are still outside."
      - "Can we light something? Anything at all?"
      - "There are more of them at night. I have counted."
      - "I get that as a skellet I should like the night, but... I don't!"
    CompanionDied:
      - "We're all going to die out here!"
      - "That could have been me!"
      - "Run for your lives!"
    Afflicted:
      - "{status}! {status}! Get it off!"
      - "I knew this would happen."
    AllyArrived:
      - "Who's that!? Oh. H-hello, {ally}."
      - "Friend? Friend. Yes. Hello."
      - "Please don't be here to fight."
      - "{ally}, is it? You're not going to k-kick me, are you?"
      - "Someone's coming! Someone's- oh."
      - "Stand near me, {ally}. No reason."

  # Convinced of its own legend.
  boastful:
    PlayerCooked:
      - "{item}! Now that is a batch."
      - "You should try my {item} sometime, {player}. Legendary."
      - "Cooking. A fine use of your afternoon, maybe, but not mine."
    PlayerSkilledUp:
      - "Getting better at {skill}? You learn from the best, after all!"
      - "I knew you had promise, {player}."
      - "Keep that {skill} training up, {player}, and you'll be as good as me!"
    Raid:
      - "Let them come."
      - "Finally, something worth my time."
      - "Oho, this will be a TALE to TELL!"
      - "I was BORN ready for this! Except I'm dead, but you know what I mean!"
    RaidEnded:
      - "Barely a warm-up."
      - "You are all welcome."
    PlayerParried:
      - "I taught you that, {player}."
      - "Nearly as good as me."
    StaggeredIt:
      - "Finish it, and I will say I helped."
      - "I loosened it up for you."
      - "Textbook. My technique, obviously."
    Afflicted:
      - "{status}? A legend endures worse."
      - "I have had worse."
      - "This {status} is merely a footnote in my book of adventures."
    Summoned:
      - "The legend {name} returns to the field!"
      - "You chose well, {player}."
    TargetAcquired:
      - "Watch this, {player}."
      - "That {target} is about to see the LEGEND in action."
      - "Ohoho, a {target}? Let's do this!"
    Hurt:
      - "A scratch!"
      - "I meant to do that."
      - "Merely a flesh-wound. Bone-wound?"
      - "It thinks {damage} damage will stop me!"
      - "Call that {damage} damage? I have felt worse in a draught."
      - "The ballad will say I shrugged off the {damage} damage."
    Killed:
      - "As foretold!"
      - "Another {target} for the ballad."
      - "Odin? You seeing this? I am worthy!"
      - "Did you SEE what I did with the {weaponskill}?"
      - "My {weapon} and I are LEGENDS, {player}!"
      - "The {weaponskill} sang, and the {target} fell."
    Idle:
      - "Ask me about the ballad."
      - "Pretty sure they still sing about me in Midgard."
      - "Stick with me, {player}, and you'll get to Valhalla easy."
      - "Even the dull parts are important for the ballad!"
      - "Is my left side or my right more portrait-worthy?"
      - "Hey {player}, put in a good word for me with Odin, huh?"
      - "{ally}! Has {player} told you about the ballad yet?"
      - "An audience of TWO. My finest hour."
