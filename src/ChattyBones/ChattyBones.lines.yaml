      - "That could have been me!"
      - "Run for your lives!"
    Afflicted:
      - "{status}! {status}! Get it off!"
      - "I knew this would happen."
    AllyArrived:
      - "Who's that!? Oh. H-hello, {ally}."
      - "Friend? Friend. Yes. Hello."
      - "Please don't be here to fight."
      - "{ally}, is it? You're not going to k-kick me, are you?"
      - "Someone's coming! Someone's- oh."
      - "Stand near me, {ally}. No reason."

  # The boastful Skelett is convinced that they are LEGENDARY.
  boastful:
    PlayerCooked:
      - "{item}! Now that is a batch."
      - "You should try my {item} sometime, {player}. Legendary."
      - "Cooking. A fine use of your afternoon, maybe, but not mine."
    PlayerSkilledUp:
      - "Getting better at {skill}? You learn from the best, after all!"
      - "I knew you had promise, {player}."
      - "Keep that {skill} training up, {player}, and you'll be as good as me!"
    Raid:
      - "Let them come. They will see there is still a Skelett that was once a viking. FOR VALHALLA!"
      - "Finally, something worth my time."
      - "Oho, now this will be a TALE to TELL!"
      - "I was BORN ready for this! Except I'm dead, but you know what I mean!"
    RaidEnded:
      - "Barely a warm-up."
      - "You are all welcome."
    PlayerParried:
      - "I taught you that, {player}."
      - "Nearly as good as me."
      - "Ah, {player}, you must have read my book of parrying!"
    StaggeredIt:
      - "Finish it, and I will say I helped."
      - "I loosened it up for you."
      - "Textbook. My technique, obviously."
    Afflicted:
      - "{status}? A legend endures worse."
      - "I have had worse."
      - "This {status} is merely a footnote in my book of adventures."
    Summoned:
      - "The legend {name} returns to the field!"
      - "You chose well, {player}."
    TargetAcquired:
      - "Watch this, {player}."
      - "That {target} is about to see the LEGEND in action."
      - "Ohoho, a {target}? Let's do this!"
      - "This {target} is nothing compared to my might! {player}, let me show you how it is done."
      - "Stand back, {player}. Give me room to work."
      - "Worry not, {player} and {ally}. The legend {name} has GOT this."
      - "A {target}! Finally, something worth a verse."
      - "You think I'm stuck here with you, {target}? You're stuck here with ME!!"
    Hurt:
      - "A scratch!"
      - "I meant to do that."
      - "Merely a flesh-wound. Bone-wound?"
      - "It thinks {damage} damage will stop me!"
      - "Call that {damage} damage? I have felt worse as a BABY!"
      - "The ballad will say I shrugged off the {damage} damage."
    Killed:
      - "As foretold!"
      - "Another {target} for the ballad."
      - "Odin? You seeing this? I am worthy!"
      - "Did you SEE that, {player}?"
      - "We are LEGENDS, {player}!"
      - "I sang, and the {target} fell."
    Unsummoned:
      - "My work here is legend! And done. Legend and done."
      - "Weep not, {player}! I shall return!"
      - "Remember me at your feasts!"
      - "The ballad continues elsewhere."
    CompanionKilled:
      - "Not bad, {companion}. Not ME, but not bad."
      - "{companion}! You have been learning from the best."
      - "I shall allow {companion} a small verse."
      - "A fine effort, {companion}. Nearly worthy."
      - "Write that one down as an assist. Mine."
    Idle:
      - "Ask me about the ballad."
      - "Pretty sure they still sing about me in Midgard."
      - "Stick with me, {player}, and you'll get to Valhalla easy."
      - "Even the dull parts are important for the ballad!"
      - "Is my left side or my right more portrait-worthy?"
      - "Hey {player}, put in a good word for me with Odin, huh?"
      - "{ally}! Has {player} told you about the ballad yet?"
      - "An audience of TWO. My finest hour."
      - "You will want to remember this day, {ally}."
    Idle[home=yes]:
      - "A fire, warm walls. A perfect place to listen to my ballad."
      - "Cook me up some food, will you {player}? Just kidding. I do not eat! Ha!"
      - "I've built greater halls than this, you know."
      - "That fire is... acceptable."
    Idle[biome=Swamp]:
      - "I have fought worse than whatever is in that water."
      - "Don't worry, {player}. I know my way through the muck."
      - "I took on three draugrs at once, once."
    Idle[biome=Mistlands]:
      - "Let whatever's out there come. I will find it by sound."
      - "I am not lost in the mist. I am scouting."
      - "Whatever is out there has not met me, {name}, yet."
      - "I think we should build a great hall here in the Mists, worthy of Valhalla."
    Idle[biome=AshLands]:
      - "These charred have never encountered the legend that is {name}."
      - "Whatever the Ashlands is going to bring, I AM READY."
      - "Lava? Pah! Bring it on."
      - "Now this place is fit for the ballad of {name}!"
      - "This. Is. Going. To. Be. AWESOME."
    Idle[time=night]:
      - "The dark holds no fear for me. I am the interesting part of it."
      - "Night suits me. Better lighting for my singing."
      - "Anything out there in the dark is welcome to try, {player}."
    AllyArrived:
      - "AH! {ally}! You have HEARD of me, surely."
      - "Look who has come to see the legend."
      - "{ally}! Come, come. Sit. Listen."
      - "Word travels, then."
      - "You are in luck, {ally}. I am in a storytelling mood."
      - "Another witness. Splendid."

