# ChattyBones Line Pack
#
# This file holds what Skeletts can say. This file gets copied into your config
# upon first loading up Valheim with the mod, at which point you can make any edits
# you'd like. This is hot reloadable: edit and save while the game is running and
# the change takes effect ~immediately. If you break something, you should see
# an error in the log, and the Skeletts keep using the last version that worked.
#
# 1. LINES AND PERSONALITIES: OVERVIEW
#
#   lines:
#     cowardly:
#       Summoned:
#         - "Do I have to?"
#
# A Skelett is given a 'personality' when you summon it. Personalities have lines
# with a little more specific character.
#
# A Skelett draws on BOTH its personality's lines and "common", for every event.
# The personality does most of the talking - about 70% of the time - and common fills
# in the rest. A personality carrying a lot more lines than common keeps its natural
# larger share instead, though that takes better than twice common's count. So "common" is not
# a fallback that only shows up when a personality is missing something; it is the
# shared voice every Skelett has. Write lines there that suit any character, and keep
# the character itself in the personality groups.
#
# This matters for how you write. It used to be that a personality group REPLACED
# common's for that event, and the trap was brutal: writing two good cowardly lines
# for an event where common had five left that Skelett with two lines instead of five.
# Writing more made the pack worse and nothing said so. That is gone: a small group
# costs you nothing now, it only concentrates the talking.
#
# Do know what that concentration sounds like. Two personality lines against five
# common ones means those two are each said about a third of the time, so they want to
# be lines you are happy to hear often. ONE line on its own is the awkward case - it
# cannot be said twice running, so it lands about 41% of the time with common covering
# the rest. Two is where it starts behaving as described.
#
# Feel free to write more lines per group than feels necessary, to keep dialogue variable,
# fun, and interesting.
#
# Personalities are whatever you name here. Two traps:
#
#   - adding, removing, or renaming personalities reshuffles which personality
#     your existing Skeletts have
#   - "common" is special: it isn't a personality, per se, it is the shared voice. It
#     must be lower case. This is hard-coded.
#
# There are three concepts that you need to know to write lines: events, tokens, context
#
#
# 2. EVENTS AND TOKENS
#
# There are currently (as of 0.1.0) thirty-two things a Skelett can react to! This 'thing'
# is an event: e.g. a player killing an enemy or getting hurt, or the Skelett being summoned.
# We also have tokens: words that can be substituted into lines, such as the player's name,
# an ally's name, a damage type, etc.
#
# The following two tokens can go in any line, and are always available:
#
#   {name}: The speaking Skelett's own name
#   {player}: The name of the summoning player (you); e.g. whose Skeletts are these
#
# The following two tokens can go in any line, but are only available if another
# Skelett or co-op player is in the vicinity:
#
#   {companion}: another of your Skeletts, picked arbitrarily
#   {ally}: another player, picked arbitrarily
#
# The following other tokens are available depending on the event that triggered the dialogue:
#
#   {target}: The Skelett's or Player's target; e.g. in combat, "Greydwarf Shaman" etc
#   {weapon}: A weapon YOU are wielding; e.g. "Mistwalker". Never a Skelett's - see §5.
#   {weaponskill}: The skill behind it; e.g. "Swords", "Elemental Magic". Yours only, same as above.
#   {damage}: The name of the damage type; e.g. Blunt, Slash, Pierce, Fire, Frost, Lightning, etc
#   {status}: A status effect, positive or negative. e.g. "Magic Barrier", or "Burning"
#   {biome}: The name of the biome the Skelett is in, e.g. "Plains", "Mistlands"
#   {item}: An item that was just picked up or eaten, e.g. "Stone", "Greydwarf Trophy", "Mushroom Omelette"
#   {skill}: A skill being used or improved, e.g. "Dodge", "Blocking"

# A line asking for a token we don't have is passed over and another is picked,
# including {ally} whenever you are playing alone, so write a plain version beside
# any line that uses a token, or it will never be said. This is good:
#
#   - "Get lost, {target}!"
#   - "Get lost!"
#
# A typo like {targat} is left alone rather than guessed at, so you will see it
# floating over a Skelett's head. Tokens are lower case and case sensitive.
#
# Refer to the table below for a quick reference of what events SHOULD hand
# a token ready for use in dialogue. Usually these tokens are populated relevant to the event.
# For example, 'CompanionDied', {companion} should be the Skelett that just fell.
# (as opposed to idle dialogue where {companion} is picked from any nearby npc)
# 'AllyArrived', using {ally} would refer to the player who just walked up.
#
#     T {target}       C {companion}     A {ally}
#     W {weapon}       K {weaponskill}  D {damage}
#     S {status}       B {biome}         I {item}
#     L {skill}
#
#                                                      T  C  A  W  K  D  S  B  I  L
#   Summoned             you raised it                 .  .  .  .  .  .  .  .  .  .
#   TargetAcquired       it picked something           T  .  .  .  .  .  .  .  .  .
#   Hurt                 something hit it              .  .  .  .  .  D  .  .  .  .
#   Buffed               it gained a helpful effect    .  .  .  .  .  .  S  .  .  .
#   Afflicted            it caught fire or poison      .  .  .  .  .  .  S  .  .  .
#   Weather              rain, water, or the swamp     .  .  .  .  .  .  S  .  .  .
#   Killed               it killed something           T  .  .  .  .  .  .  .  .  .
#   Died                 it died                       .  .  .  .  .  .  .  .  .  .
#   Unsummoned           it timed out or strayed       .  .  .  .  .  .  .  .  .  .
#   Idle                 nothing is happening          .  .  .  .  .  .  .  .  .  .
#   PlayerHurt           you took a hit                .  .  .  .  .  D  .  .  .  .
#   PlayerLandedABigHit  you hit something hard        T  .  .  W  K  D  .  .  .  .
#   PlayerGotAKill       you killed something          T  .  .  W  K  .  .  .  .  .
#   CompanionHurt        another Skelett was hit       .  C  .  .  .  D  .  .  .  .
#   CompanionKilled      another Skelett got a kill    T  C  .  .  .  .  .  .  .  .
#   CompanionDied        another Skelett died          .  C  .  .  .  .  .  .  .  .
#   CompanionSummoned    another was just raised       .  C  .  .  .  .  .  .  .  .
#   PlayerParried        you turned a blow in time     T  .  .  .  .  .  .  .  .  .
#   PlayerStaggered      something knocked you about   T  .  .  .  .  .  .  .  .  .
#   StaggeredIt          you knocked something about   T  .  .  .  .  .  .  .  .  .
#   PlayerDodged         you rolled clear of a blow    .  .  .  .  .  .  .  .  .  .
#   Dawn                 the sun came up               .  .  .  .  .  .  .  B  .  .
#   Nightfall            the light went                .  .  .  .  .  .  .  B  .  .
#   BiomeChanged         you crossed a biome border    .  .  .  .  .  .  .  B  .  .
#   Raid                 something is coming           .  .  .  .  .  .  .  .  .  .
#   RaidEnded            you saw it off                .  .  .  .  .  .  .  .  .  .
#   AtHome               you settled in safely         .  .  .  .  .  .  .  .  .  .
#   Looted               you picked something up       .  .  .  .  .  .  .  .  I  .
#   PlayerAte            you ate something             .  .  .  .  .  .  .  .  I  .
#   PlayerCooked         you made food or mead         .  .  .  .  .  .  .  .  I  .
#   PlayerSkilledUp      you got better at something   .  .  .  .  .  .  .  .  .  L
#   AllyArrived          another player came near      .  .  A  .  .  .  .  .  .  .
#
# The above table is unfortunately not a 100% guarantee; there are edge cases where
# the token might not be available.
#
# Weather is tricky, and I might remove it in the future or find a better way to
# work it. Mostly this is reacting to the Wet condition, so swimming in water also
# triggers it.
#
# Event names are case-sensitive, like tokens.
#
# 3. CONTEXT
#
# Context is how we can limit lines to certain conditions. For example:
#
#   cowardly:
#     Idle:
#       - "Ho humm, ho humm, I'm a little Skelett-ton."
#     Idle[biome=Swamp]:
#       - "Why... is it... so wet?!"
#
# With this, we can filter dialogue to specific token values.
# Only the following are provided as of version 0.1.0:
#
#   biome=    Meadows   BlackForest   Swamp   Mountain   Plains
#             Mistlands   AshLands   DeepNorth   Ocean
#   time=     morning   afternoon   evening   night
#   home=     yes   no
#
# biome: Hopefully self-explanatory ;-)
#
# time: self-explanatory, should be aligned with game-time.
# (morning is dawn to noon, afternoon noon to sunset, evening sunset to midnight, night midnight to dawn)
#
# home: resting, sheltered, near a fire, in a 'base'.
# This is relative to the player and not the Skelett, because I couldn't get access
# to these properties on the Skelett (or couldn't figure out how), so in theory
# you could have some Skeletts outside your home saying nice things about it.
#
# At this time, this mod does not handle multiple context in a single line;
# e.g. Idle[biome=Swamp,time=night] is refused.
#
# 4. ORDERING
#
# Obviously, many lines might apply to any given situation. Two groups get picked, one
# from the personality and one from common, and the Skelett draws from both:
#
#   from the personality:  lines that apply to this context, in file order (higher up
#                          wins), and if it has none tagged for where it is standing,
#                          its plain lines
#   from common:           the same, one more time
#
# It then speaks from the personality's group about 70% of the time - or more, if the
# personality has more lines than common has - and from common's group the rest.
#
# Two things follow that are worth knowing:
#
#   - a context group in "common" is now worth writing. It used to be unreachable
#     whenever the personalities had any plain lines for that event, which is why the
#     atmosphere in this pack is written four times over. Write a swamp once in common
#     and every personality gets it, on top of their own.
#   - if a group has nothing it can say right now - every line wants a {token} we
#     haven't got - the other group is used instead. You get less variety, never
#     silence.
#
# 5. WORDING TIPS:
#
#   - {weapon} and {weaponskill} only work when YOU swung - so on PlayerGotAKill and
#     PlayerLandedABigHit, and nowhere else. Note that PlayerHurt is not on that list:
#     the weapon on a blow coming in is the *attacker's*, and a greydwarf's is no more
#     honest than a Skelett's. Put either token in a Skelett's own line and it will
#     effectively never be said - the only exception is another player striking the
#     blow, which is PvP, and not worth writing for.
#
#     This is the game's doing rather than a choice. Valheim describes a player's
#     equipment properly and does not bother for a creature's: a Skelett's sword is
#     named "Dragur axe" in the data, and its bow reports its skill as Swords. Both are
#     leftovers nobody filled in. We would rather say nothing than say either of those
#     over a Skelett's head, so the token comes back empty and the line is passed over.
#     There is no way for a pack to get at it - if you want a Skelett to talk about how
#     it fights, write it into the words.
#   - {damage} is just the damage type, capitalized; e.g. Pierce. So consider how that should
#     be used in a sentence. "Ouch, the Pierce!" doesn't sound that good. "Hurt by Pierce damage"
#     sounds better. "A Blunt hit!" reads fine.
#   - {weaponskill} is a skill name rather than a weapon: Swords, Unarmed, Blood
#     Magic, so be cautious how it is used in a sentence. "A fine use of Swords"
#     works; "handy with the Swords" feels clunky.
#   - {status}, {biome}, {item}, {damage} and {weaponskill} all arrive capitalized,
#     the way the game names them, and we don't adjust capitalization.
#
# 6. LOCALIZATION:
# 
# Right now the mod only ships in English by default, as it is unfortunately
# the only language I know how to speak.
# 
# You can definitely write the entire pack in any language, though!
# The tokens all come from the game, and should be localized by Valheim itself.
#
# If this mod is enjoyed by the community and people wish to contribute more languages,
# I'll look into adding full localization support so the mod can ship with multiple versions
# of the pack based on the player's language.
#
#
# 7. MULTIPLAYER
#
# Everybody running ChattyBones sees everybody's Skeletts talk. No need to install
# server-side, and if you're playing with friends that don't have the mod, that's fine!
# They just won't see anything.
#
# You do NOT need the same lines file as your friends. When transmitting what line is
# spoken, we send a pack of context and indices, but their lines can differ from yours
# and that's fine. However, we do recommend keeping the same pack if you want consistent
# dialogue; e.g. if you both want to hear, 'Nice hit, {player}' at the same time.
#
# Only want to hear your own Skeletts? That's fine! Toggle 'HearOthers' in the mod config.
#
#
# 8. YAML, BRIEFLY
#
# This is a YAML file. It's a collection of organized key-value pairs, like JSON.
# Indentation is meaningful and how the mod processes organization.
# Use spaces (not tabs), the same amounts you see in the file.
#
# Keep the "double quotes" around every line below. Without them YAML reads several
# ordinary ways of opening a line as syntax, and it'll cause problems.
# Bad examples (don't do these):
#
#   - {player}! Watch it!           { starts an object
#   - 'Tis but a scratch!           ' starts a quoted string
#   - *rattles bones*               * starts a reference
#   - Listen up: here's the plan    YAML thinks this is a new key value pair now
#   - You're # 1!                   everything from # is dropped (like a comment)
#
# Even inside double quotes, a backslash starts an escape, so write two.
#
#   - "\\o/"                       one backslash refuses the file
#   - "shrug: ¯\\_(o_o)_/¯"        one backslash silently eats a character
#
# 9. COLOR
# 
# This mod supports colored text, organized by 'event' category.

colors:

  # Name as many or as few as you like. "normal" is the one every event uses
  # unless it is listed under events: below. Leave it out for Valheim's white.
  palette:
    normal: "#E8E4DC"
    alarm: "#F0A9A0"
    triumph: "#EFD79A"

  # Which events depart from normal.
  events:
    Died: alarm
    Hurt: alarm
    PlayerHurt: alarm
    CompanionHurt: alarm
    CompanionDied: alarm
    Afflicted: alarm
    Killed: triumph
    PlayerGotAKill: triumph
    CompanionKilled: triumph
    PlayerStaggered: alarm
    PlayerParried: triumph
    StaggeredIt: triumph
    PlayerDodged: triumph
    Raid: alarm
    RaidEnded: triumph

# 10. THE LINES
#
# That's it, no more documentation. These are the lines!

lines:

  common:
    Summoned:
      - "Up we get."
      - "Who disturbs me? Oh. You."
      - "Right then, {player}."
    TargetAcquired:
      - "That {target} is mine."
      - "Oi! {target}!"
      - "Here we go."
      - "{target}. Right."
      - "Something to do at last."
      - "Mind the {target}, {player}."
    Hurt:
      - "Ow."
      - "That was a rib!"
      - "Still standing."
      - "Took some {damage} damage there."
    Buffed:
      - "Ooh, that's the stuff."
      - "Much obliged."
      - "{status}? Don't mind if I do."
    Afflicted:
      - "Ah. {status}. Wonderful."
      - "I do not care for this."
      - "{status}! Somebody do something!"
    Weather:
      - "{status}. Feel it in my bones."
      - "{status}. Marvellous."
      - "This is why I stayed buried."
      - "I feel {status}."
      - "Does anyone else feel that?"
    Killed:
      - "Down it goes."
      - "That {target} won't get up."
      - "Next."
      - "That is what we are for."
      - "It never stood a chance."
    Died:
      - "Bugger."
      - "Tell my mum."
      - "Back to the dirt."
    Unsummoned:
      - "Off I go, then."
      - "See you, {player}."
      - "That's me done."
      - "Back to it, I suppose."
    Idle:
      - "Nice weather for it."
      - "Anyone else cold?"
      - "I miss having skin."
      - "Hmm."
      - "{companion}, your insides are showing."
      - "Do you still have dreams, {player}?"
    PlayerHurt:
      - "{player}! Watch it!"
      - "They got you!"
      - "Careful, {player}."
      - "{player}! That was a {damage} hit!"
      - "Mind the {damage} damage, {player}."
    PlayerLandedABigHit:
      - "Ooooh."
      - "Did you see that?"
      - "Lovely hit, {player}."
      - "Nice {damage} hit with that {weapon}!"
      - "A fine use of {weaponskill}."
    PlayerGotAKill:
      - "Got him!"
      - "Nice one, {player}."
      - "Nice {weaponskill} work, {player}."
      - "Leave some for me, {player}."
    CompanionHurt:
      - "{companion}!"
      - "They're on {companion}!"
      - "Hang on, {companion}!"
      - "{companion} is taking {damage} damage!"
      - "It's {damage} damage on {companion}, {player}!"
    CompanionKilled:
      - "Leave some for me, {companion}."
      - "Neatly done, {companion}."
      - "{companion} got the {target}."
      - "Show-off."
    CompanionDied:
      - "Oh no, {companion}!"
      - "{companion}! Get up!"
      - "They got {companion}."
    CompanionSummoned:
      - "Welcome to the party, {companion}."
      - "Look who's up."
      - "Get ready, {companion}."
    PlayerParried:
      - "Oh, that was clean."
      - "Turned it! Straight back at it."
      - "That {target} did not expect that."
      - "Beautiful, {player}."
    PlayerStaggered:
      - "{player}! Stay on your feet!"
      - "Steady, {player}!"
      - "That {target} is winning."
      - "Up, up, up!"
    StaggeredIt:
      - "The {target} is reeling!"
      - "Now! While it is down!"
      - "It did not care for that."
      - "Its guard is all over the place."
    PlayerDodged:
      - "Nimble!"
      - "Nothing touched you."
      - "How did you even do that?"
      - "I could never do that. No knees, see."
    Dawn:
      - "Ugh. Daylight."
      - "Morning over the {biome}. Joy."
      - "Well, at least it'll be safer outside, now."
      - "Another day of this, then."
    Nightfall:
      - "Ah. Better."
      - "Night over the {biome}. That is more like it."
      - "Now we are in our element."
      - "Dark again. Good."
    BiomeChanged:
      - "The {biome}. Right."
      - "Back in the {biome}, then."
      - "I have a bad feeling about the {biome}."
      - "This place again."
    Raid:
      - "Something is coming."
      - "Something is out there."
      - "That does not sound good."
      - "Stand ready."
    RaidEnded:
      - "Still standing."
      - "Well. That happened."
      - "Is that all of them?"
      - "We saw it off."
    AtHome:
      - "Right. Feet up."
      - "Walls, a roof, a fire. Luxury."
      - "Nothing is trying to eat us. Novel."
      - "Safe as anything."
    Looted:
      - "More {item}, then."
      - "That {item} looks useful. Probably."
      - "Pocketing the {item}, are we?"
      - "Finders keepers, I suppose."
    PlayerAte:
      - "Eating some {item}? I used to eat."
      - "It goes straight through me these days."
      - "Enjoy the {item}. Truly."
      - "I remember tasting things."
    PlayerCooked:
      - "{item}. That takes me back."
      - "Making {item}, are we."
      - "The smell does nothing for me. It used to."
      - "All that work, and you will have it swallowed in a moment."
    PlayerSkilledUp:
      - "Better at {skill} now, are you."
      - "Your {skill} improves, {player}."
      - "Practice does it."
      - "You will be dangerous eventually."
    AllyArrived:
      - "Hail, {ally}."
      - "Company, {player}."
      - "Somebody's coming."
      - "Well met, {ally}."
      - "{ally}. You are a long way out."
      - "Another warm one. Hello."

  # The 'cowardly' Skelett doesn't want to be here, is afraid of everything, wants to spend
  # as much time as possible back at base
  cowardly:
    PlayerCooked:
      - "Is that {item} for me, {player}? N-nevermind. I can't eat."
      - "Doesn't the cooking oil s-splatter a little?"
      - "{item} must s-smell nice, if I had a nose."
      - "Wow, I really wish I could taste {item}."
      - "H-hey, that looks pretty good!"
    Looted:
      - "Is that {item} safe to carry?"
      - "That looks heavy."
      - "Ooh. {item}."
    Raid:
      - "I want to go inside!"
      - "Can we not be here?"
      - "WHY DOES THIS ALWAYS HAPPEN TO ME!?"
      - "OH NO THE ENEMY IS HERE!! AAAAH!!!!"
    AtHome:
      - "Oh thank goodness, we're home."
      - "We are staying, yes? We are staying."
      - "I just w-wanna stay here. If that's okay."
      - "Maybe if I close my eyes I can pretend I'm sitting in a corner, reading a book..."
    PlayerStaggered:
      - "We are losing! We are losing!"
      - "Get up! Please get up!"
      - "This was a terrible idea!!!"
    PlayerDodged:
      - "Do that again, {player}! Do that every time!"
      - "How did you do that dodge?!"
      - "Whoaaaa that would have totally hit me if I were you!"
    Summoned:
      - "Do I have to?"
      - "Oh no, not again."
      - "Oh, uh, h-hey. How's it going {player}?"
    TargetAcquired:
      - "Is that a {target}? I'd rather not."
      - "Uh, I'm r-right behind you, {player}."
      - "Has anyone else seen the {target}? No? Just me?"
      - "I'll go last. I'm very good at last."
      - "W-we could just walk away. Couldn't we?"
      - "Oh gods, it's looking at me."
    Hurt:
      - "Aaargh!"
      - "I'm hit! I'm hit!"
      - "This is exactly what I meant."
      - "Ow! The {damage} damage! Not the {damage} damage!"
      - "I do not like {damage} damage. I do not like it one bit."
      - "Why is it always {damage} damage?"
    Killed:
      - "Did I do that?"
      - "It was mostly {player}, honestly."
      - "Now I never want to fight another {target} again!"
      - "It just sort of happened! Around me!"
      - "Is it over? Can I open my eyes?"
      - "I mostly h-held on to my weapon and h-hoped."
    Unsummoned:
      - "Oh thank the gods. Byeeee!"
      - "Finally! I mean... aw. Do I have to go?"
      - "Was I any help? I tried to be."
      - "No worries if you don't call me back soon, {player}."
    CompanionKilled:
      - "Better you than me, {companion}!"
      - "See? {companion} can do it. So I, uh, don't have to."
      - "Nice one, {companion}. Please keep doing that."
      - "That's one that won't be coming for me. Thank you, {companion}."
      - "I helped! Sort of. I was nearby."
    Idle:
      - "Can we go home?"
      - "It's very open out here."
      - "You'll look after us too, won't you {ally}?"
      - "Are you s-staying, {ally}? Only, it's safer in numbers."
      - "{ally} looks like they know what they're doing. Let's follow them, {player}."
    Idle[home=yes]:
      - "H-hey, it's nice and cozy here! Can we stay, {player}?"
      - "Nothing out there can get in, right?"
      - "Let's never leave. I mean it."
      - "I mean, why would we wanna go back out there anyway?"
    Idle[biome=Swamp]:
      - "I do not like it here."
      - "Can we go back to the open bit?"
      - "Every one of these trees is looking at me."
      - "Why is the water making that sound?"
    Idle[biome=Mistlands]:
      - "I would like to state that I am against this."
      - "{player}? Are you still there?"
      - "I can't see anything in this mist!"
      - "I keep hearing things and none of this is pleasant."
    Idle[biome=Plains]:
      - "I keep hearing this buzzing sound!"
      - "W-why does this feel like the meadows, but wrong?"
      - "You haven't seen any of those Tar Growths, have you?"
      - "Can't s-stand that laughter from the little guys..."
    Idle[biome=AshLands]:
      - "Why is it so hot here?!"
      - "And I thought the Mistlands was bad..."
      - "I'm not liking the look of that lava..."
      - "What IS this accursed place?!"
      - "Odin save me, I never did anything to deserve this..."
    Idle[time=night]:
      - "It's dark. It's dark and we are still outside."
      - "Can we light something? Anything at all?"
      - "There are more of them at night. I have counted."
